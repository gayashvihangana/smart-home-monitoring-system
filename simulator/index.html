<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="top-bar">
            <h1>Smart Home Simulator</h1>
            <div id="connection-status" class="status-badge connecting">Connecting...</div>
        </header>

        <section class="global-actions">
            <button class="btn-global btn-power" onclick="window.powerOffAll()">Power Off All</button>
            <button class="btn-global btn-disconnect" onclick="window.disconnectAll()">Disconnect All</button>
        </section>

        <main id="devices">
            <!-- Devices will be rendered here -->
        </main>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getDatabase, ref, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

        import { firebaseConfig } from './firebase-config.js';
        import { setupSimulator } from './app.js';

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        setupSimulator(db);
    </script>
</body>
</html>
