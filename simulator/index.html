<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Smart Home Simulator</h1>
    <div id="connection-status">Connecting...</div>
    <div id="devices">
        <!-- Devices will be rendered here -->
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

        import { firebaseConfig } from './firebase-config.js';
        import { simCredentials } from './sim-credentials.js';
        import { setupSimulator } from './app.js';

        // The simulator stands in for physical hardware, but the rules grant no
        // hardware exemption: homes/$homeId requires auth != null AND membership of
        // meta/members, for reads and writes alike. So it signs in as its own device
        // account, whose UID is seeded into the members map, and is just another
        // member as far as the database is concerned.
        //
        // Sign-in must complete BEFORE setupSimulator. Attaching the listeners first
        // fires them while still anonymous, and every one fails permission denied.
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // The simulator stands in for physical hardware, which has no user
        // account — but the security rules still require an authenticated
        // identity, so it signs in anonymously. This has to complete BEFORE any
        // listener is attached: a read issued while auth is still null is
        // rejected outright, and Firebase does not retry a denied listener.
        signInAnonymously(auth)
            .then(() => setupSimulator(db))
            .catch((error) => {
                const el = document.getElementById('connection-status');
                el.textContent =
                    'Could not authenticate: ' + error.code +
                    ' — enable Anonymous sign-in in the Firebase console.';
                el.style.color = 'red';
            });
    </script>
</body>
</html>
